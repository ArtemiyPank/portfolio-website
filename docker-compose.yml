services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-3001}:3000"
    environment:
      # Application
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"

      # Authentication
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-123}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-nextauth_secret_here_change_in_production}"

      # Database
      DATABASE_URL: "file:./data/portfolio.db"

      # Public URL
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3001}"

      # Domain (for production)
      DOMAIN: "${DOMAIN:-localhost}"

      # Email (Resend)
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-onboarding@resend.dev}"
      RESEND_TO_EMAIL: "${RESEND_TO_EMAIL:-ad.pankrat@gmail.com}"

    volumes:
      # Persist database
      - ./data:/app/data:z

      # Persist uploaded files
      - ./public/uploads:/app/public/uploads:z

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/projects', (res) => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - portfolio_network

  # Caddy reverse proxy (optional, for production)
  caddy:
    image: caddy:2-alpine
    container_name: portfolio-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      portfolio:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - production
    networks:
      - portfolio_network

networks:
  portfolio_network:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
