version: '3.8'

services:
  portfolio:
    user: root
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      DATABASE_URL: "file:./data/portfolio.db"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3001}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-your_secret_here}"
    # Bind-mount the DB file and uploads folder directly from your project
    volumes:
      - ./data:/app/data/:z
      - ./public/uploads:/app/public/uploads:z
#      - portfolio_uploads:./public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/projects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - portfolio_network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portfolio
    restart: unless-stopped
    profiles:
      - production
    networks:
      - portfolio_network

volumes:
  portfolio_db:
  portfolio_uploads:

  caddy_data:
  caddy_config:

networks:
  portfolio_network:
    driver: bridge
